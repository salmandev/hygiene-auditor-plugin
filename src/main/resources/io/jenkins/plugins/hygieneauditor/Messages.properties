SharedLibrariesCollector.DisplayName=Shared libraries
SharedLibrariesCollector.SuggestedAction=Ask the pipeline owners before removing anything: this is based on the latest run of each job. If it is unused, remove it from the library repository or the library configuration.
PluginsCollector.DisplayName=Plugins
PluginsCollector.OrphanAction=Review under Manage Jenkins, Manage Old Data. If the plugin was removed on purpose, discard the unreadable data after checking the item still works; if it was removed by accident, reinstall it.
PluginsCollector.ReviewAction=Ask who installed this plugin and why. If nobody needs it, uninstall it during a maintenance window and watch for errors.
