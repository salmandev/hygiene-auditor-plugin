HygieneAuditorLink.DisplayName=Hygiene Auditor
HygieneAuditorLink.Description=Find likely-unused credentials, jobs, agents, libraries and plugin data, with evidence and confidence.
JobsCollector.DisplayName=Jobs and folders
JobsCollector.SuggestedAction=Review the job. If it is no longer needed, archive its configuration and delete it, or keep it disabled with a documented reason.
AgentsCollector.DisplayName=Agents
AgentsCollector.SuggestedAction=Confirm the agent is decommissioned, then remove the node (and its machine) or bring it back online.
CredentialsCollector.DisplayName=Credentials
CredentialsCollector.SuggestedAction=Confirm with the owning team and review the dynamic-reference caveats first. If it is unused, revoke the secret at its source, then delete the credential.
