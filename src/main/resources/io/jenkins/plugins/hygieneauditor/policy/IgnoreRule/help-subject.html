<div>
  A Java regular expression searched in the name of the thing the finding is about: the id for a credential, the
  full name for a job, agent, library or plugin. Leave empty to match every name.
  Examples: <code>^prod-.*</code> matches names that start with <code>prod-</code>; <code>-legacy$</code> matches
  names that end with <code>-legacy</code>.
</div>
