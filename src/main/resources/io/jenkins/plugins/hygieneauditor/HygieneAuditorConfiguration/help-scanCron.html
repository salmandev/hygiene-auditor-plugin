<div>
  Cron expression(s) for scheduled scans, one per line, in the same syntax as build triggers
  (for example <code>H 3 * * 0</code> for weekly on Sunday at a hashed minute in the 3am hour).
  Leave empty to run scans only when started manually or from a pipeline.
  Scans are read-only and run at low priority.
</div>
